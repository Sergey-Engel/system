global:
  scrape_interval: 10s
  scrape_timeout: 8s

scrape_configs:
  - job_name: macbook-wg-peer
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - host.docker.internal:19108
  - job_name: vpn-host-probe
    static_configs:
      - targets:
          - host.docker.internal:9105
  - job_name: timeweb-uplink-pilot
    scrape_interval: 30s
    scrape_timeout: 8s
    static_configs:
      - targets:
          - host.docker.internal:19106
